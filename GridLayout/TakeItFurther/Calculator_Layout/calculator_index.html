<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="cal_styles.css">
</head>
<body>
    <h1>Calculator Layout Using Grid</h1>

    <main>
        <div class="calculator-layout">
            <div>
                <p>1</p>
            </div>
            <div>
                <p>2</p>
            </div>
            <div>
                <p>3</p>
            </div>
            <div class="add-row-span-2">
                <p>+</p>
            </div>
            <div>
                <p>4</p>
            </div>
            <div>
                <p>5</p>
            </div>
            <div>
                <p>6</p>
            </div>
            <div>
                <p>7</p>
            </div>
            <div class="equal-row-span-2">
                <p>=</p>
            </div>
            <div>
                <p>8</p>
            </div>
            <div>
                <p>9</p>
            </div>
            <div>
                <p>/</p>
            </div>
            <div>
                <p>0</p>
            </div>
            <div>
                <p>*</p>
            </div>
            <div class="col-span-4">
                <p>clear</p>
            </div>
            
            
            
            

        </div>
    </main>
</body>
</html>
